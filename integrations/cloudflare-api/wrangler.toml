name = "medbiohim-api-shadow"
main = "src/index.js"
compatibility_date = "2026-10-11"
workers_dev = true

# Deliberately isolated from production. This Worker is a shadow scaffold:
# it does not replace the SpaceWeb PHP API and does not proxy requests to it.
[vars]
APP_ENV = "shadow"
MEDBIOHIM_APP_ORIGIN = "https://medbiohim.vercel.app"

# Cloudflare native rate limiting. Keys are client IPs in src/index.js.
# Keep thresholds conservative until real traffic is observed.
[[ratelimits]]
name = "AUTH_LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AUTH_REGISTER_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
