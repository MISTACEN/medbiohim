name: MEDBIOHIM code checks

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Vercel/SpaceWeb architecture
        run: |
          set -euo pipefail
          test -f src/app/api/v1/'[...path]'/route.ts
          test ! -f api/index.php
          grep -q 'SPACEWEB_API_ORIGIN' src/app/api/v1/'[...path]'/route.ts
          grep -q 'NEXT_PUBLIC_API_URL' .env.example
      - name: Detect literal escaped-newline source artifacts
        run: |
          set -euo pipefail
          if grep -RInE '\\n[[:space:]]*(async|const|let|var|return|export|import|function|if|for|while|class|type|interface|<)' src backend --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.php'; then
            echo 'Found a literal \\n embedded in source code.'
            exit 1
          fi
      - name: Detect duplicate HTTP method+route registrations
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $files = glob("backend/config/routes/*.php") ?: [];
          $seen = [];
          $failed = false;
          foreach ($files as $file) {
              $src = file_get_contents($file);
              if ($src === false) {
                  fwrite(STDERR, "Could not read route file: {$file}\n");
                  exit(2);
              }
              $pattern = '~\$[a-zA-Z_][a-zA-Z0-9_]*->(get|post|put|patch|delete)\(\s*([\'"])([^\'"]+)\2~';
              if (preg_match_all($pattern, $src, $matches, PREG_SET_ORDER)) {
                  foreach ($matches as $hit) {
                      $key = strtoupper($hit[1]) . " " . $hit[3];
                      if (isset($seen[$key])) {
                          fwrite(STDERR, "Duplicate route: {$key} in {$seen[$key]} and {$file}\n");
                          $failed = true;
                      } else {
                          $seen[$key] = $file;
                      }
                  }
              }
          }
          if ($failed) exit(1);
          echo "Checked " . count($seen) . " unique route registrations.\n";
          PHP

      - name: Full local-equivalent pre-deploy audit
        run: npm run predeploy:audit

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax check
        run: |
          set -euo pipefail
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Training payload sanitizer regression tests
        run: php backend/tests/TrainingPayloadSanitizerTest.php
      - name: Supabase trusted-role regression tests
        run: php backend/tests/SupabaseAuthRoleTest.php
      - name: Bootstrap route registration smoke test
        run: |
          set -euo pipefail
          php -d display_errors=1 -r '
            $root = getcwd() . "/backend";
            spl_autoload_register(static function (string $class) use ($root): void {
              $prefix = "Medbiohim\\";
              if (!str_starts_with($class, $prefix)) return;
              $relative = str_replace("\\", "/", substr($class, strlen($prefix)));
              $file = $root . "/src/" . $relative . ".php";
              if (is_readable($file)) require_once $file;
            });
            $router = new \Medbiohim\Http\Router();
            $register = require $root . "/config/routes.php";
            if (!is_callable($register)) throw new \RuntimeException("config/routes.php must return callable");
            $register($router);
            echo "Route registration OK\\n";
          '
