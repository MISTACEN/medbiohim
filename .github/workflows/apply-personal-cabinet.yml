name: Apply personal cabinet dashboard
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write dashboard + my routes from artifacts payload
        run: |
          python3 << 'ENDPY'
          import base64, urllib.request
          from pathlib import Path
          # fallback: fetch from raw if we store b64 in scripts/
          # For reliability load from committed script files if present
          dash_path = Path('scripts/cabinet/dashboard.b64')
          my_path = Path('scripts/cabinet/my.b64')
          if not dash_path.exists() or not my_path.exists():
              raise SystemExit('missing scripts/cabinet/*.b64 payloads')
          Path('workers/api/src/routes/dashboard.ts').write_bytes(base64.b64decode(dash_path.read_text().strip()))
          Path('workers/api/src/routes/my.ts').write_bytes(base64.b64decode(my_path.read_text().strip()))
          for p in ['workers/api/src/routes/dashboard.ts', 'workers/api/src/routes/my.ts']:
              t = Path(p).read_text()
              assert 'export default' in t and 'PLACEHOLDER' not in t
              print('ok', p, len(t))
          ENDPY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/routes/dashboard.ts workers/api/src/routes/my.ts
          git status
          git commit -m "feat(api): personal cabinet dashboard (schedule/hw/tests) + my profile root" || exit 0
          git push origin HEAD:main
