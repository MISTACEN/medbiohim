name: Apply P0 v2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject academic endpoint into admin.ts
        run: |
          python3 << 'PY'
          from pathlib import Path
          admin = Path('workers/api/src/routes/admin.ts')
          t = admin.read_text()
          if 'admin.put("/users/:id/academic"' in t:
              print('already present')
          else:
              snippet = Path('scripts/p0/academic.ts.snippet').read_text()
              for marker in ['// Telegram chat management', 'admin.route("/database"', 'export default admin']:
                  if marker in t:
                      t = t.replace(marker, snippet + '\n' + marker, 1)
                      break
              admin.write_text(t)
              print('injected')
          assert 'admin.put("/users/:id/academic"' in admin.read_text()
          PY

      - name: Write groups.ts and subjects.ts from artifact mirrors in repo
        run: |
          # Prefer full files if present under scripts/p0
          if [ -f scripts/p0/groups.ts ]; then cp scripts/p0/groups.ts workers/api/src/routes/groups.ts; fi
          if [ -f scripts/p0/subjects.ts ]; then cp scripts/p0/subjects.ts workers/api/src/routes/subjects.ts; fi
          # Fallback: decode b64 parts if present
          python3 << 'PY'
          import base64
          from pathlib import Path
          root = Path('scripts/p0')
          def join(prefix):
              parts = sorted(root.glob(prefix + '*.b64'))
              if not parts: return None
              return ''.join(p.read_text().strip() for p in parts)
          for prefix, dest in [('g', 'workers/api/src/routes/groups.ts'), ('s', 'workers/api/src/routes/subjects.ts')]:
              raw = join(prefix)
              if raw:
                  Path(dest).write_bytes(base64.b64decode(raw))
                  print('decoded', dest)
          for p in ['workers/api/src/routes/groups.ts', 'workers/api/src/routes/subjects.ts']:
              t = Path(p).read_text()
              print(p, 'len', len(t), 'export' , 'export default' in t)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/routes/admin.ts workers/api/src/routes/groups.ts workers/api/src/routes/subjects.ts || true
          git status
          git commit -m "feat(api): P0 academic + groups/subjects CRUD" || exit 0
          git push origin HEAD:main
