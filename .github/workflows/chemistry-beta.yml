name: Chemistry Beta

on:
  push:
    branches: [beta]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/chemistry-beta.yml"
  pull_request:
    branches: [beta]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
