<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="Схема поперечного среза миелинового нервного волокна">
  <rect width="420" height="300" fill="#f8fafc"/>
  <!-- нейролемма -->
  <circle cx="210" cy="140" r="112" fill="#e5e7eb" stroke="#111827" stroke-width="2"/>
  <!-- миелиновый слой: концентрические витки -->
  <circle cx="210" cy="140" r="96" fill="none" stroke="#111827" stroke-width="16"/>
  <circle cx="210" cy="140" r="76" fill="none" stroke="#f8fafc" stroke-width="4"/>
  <circle cx="210" cy="140" r="66" fill="none" stroke="#111827" stroke-width="14"/>
  <!-- осевой цилиндр -->
  <circle cx="210" cy="140" r="52" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
  <!-- номера -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <circle cx="210" cy="140" r="13" fill="#dc2626"/><text x="206" y="145" fill="#fff">1</text>
    <circle cx="210" cy="52" r="13" fill="#dc2626"/><text x="206" y="57" fill="#fff">2</text>
    <circle cx="322" cy="140" r="13" fill="#dc2626"/><text x="318" y="145" fill="#fff">3</text>
    <circle cx="150" cy="88" r="13" fill="#dc2626"/><text x="146" y="93" fill="#fff">4</text>
  </g>
  <text x="20" y="278" font-family="Arial, sans-serif" font-size="13" fill="#475569">Схема: поперечный срез — «кольцо в кольце», перехватов и насечек не видно.</text>
</svg>