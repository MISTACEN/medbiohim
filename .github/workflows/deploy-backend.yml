name: Legacy SpaceWeb deployment (disabled)

# SpaceWeb is a frozen legacy environment. Do not deploy to it.
# Keep this workflow as an explicit guard so old manual invocations are harmless.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled legacy deployment
        run: |
          echo "SpaceWeb deployment is intentionally disabled."
          echo "All active backend work and deployment must target Cloudflare from main."
          echo "No FTP connection or legacy server changes were made."
