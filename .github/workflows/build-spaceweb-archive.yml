name: Build SpaceWeb backend archive
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "ROADMAP.md"
      - "PHASES_STATUS.md"
      - "SYNC_STAMP.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend archive
        run: |
          rm -rf /tmp/medbiohim-spaceweb
          mkdir -p /tmp/medbiohim-spaceweb
          cp -a backend /tmp/medbiohim-spaceweb/backend
          rm -f /tmp/medbiohim-spaceweb/backend/.env
          printf 'MEDBIOHIM SpaceWeb archive\nSource: $GITHUB_SHA\nKeep production backend/.env on SpaceWeb.\n' > /tmp/medbiohim-spaceweb/SPACEWEB-UPDATE.txt
          cd /tmp/medbiohim-spaceweb
          zip -qr "$GITHUB_WORKSPACE/medbiohim-spaceweb-$GITHUB_SHA.zip" backend SPACEWEB-UPDATE.txt \
            -x 'backend/.env*' -x 'backend/*/.env*' -x '*/.env*'
      - name: Reject environment files in archive
        run: |
          set -euo pipefail
          if zipinfo -1 "$GITHUB_WORKSPACE/medbiohim-spaceweb-$GITHUB_SHA.zip" | grep -E '(^|/)\.env($|\.)'; then
            echo 'Environment file leaked into SpaceWeb archive'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: medbiohim-spaceweb-backend-${{ github.sha }}
          path: medbiohim-spaceweb-${{ github.sha }}.zip
          if-no-files-found: error
