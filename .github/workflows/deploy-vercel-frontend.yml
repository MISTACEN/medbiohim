# Frontend deployment via GitHub Actions (Vercel alternative)
# Alternative to direct Vercel CI/CD to avoid npm ci issues with missing lockfile

name: Deploy MEDBIOHIM Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/deploy-vercel-frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      # Option 1: Deploy to Vercel directly using their CLI
      - name: Deploy to Vercel
        run: npx vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      # Option 2: Or deploy to Cloudflare Pages instead (comment above, uncomment below)
      # - name: Build and deploy to Cloudflare Pages
      #   run: |
      #     npx wrangler pages project create medbiohim-frontend --commit-hash=${{ github.sha }} || true
      #     npx wrangler pages deploy .next/dist --project-name=medbiohim-frontend
      
      - name: Store deployment URL
        run: echo "Deployment completed at $(date)" > deployment-info.txt
      
      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: deployment-info.txt
