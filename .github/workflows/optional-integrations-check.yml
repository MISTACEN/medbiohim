name: MEDBIOHIM optional integrations checks

on:
  push:
    branches: [main, beta]
    paths:
      - "integrations/browser-extension/**"
      - "integrations/telegram-bot/**"
      - "integrations/telegram-bot-cloudflare/**"
      - "integrations/cloudflare-api/**"
      - "tools/import_histology_media.py"
      - "tools/test_import_histology_media.py"
      - "docs/histology-mbh-import-plan.md"
      - ".github/workflows/optional-integrations-check.yml"
  pull_request:
    branches: [main, beta]
    paths:
      - "integrations/browser-extension/**"
      - "integrations/telegram-bot/**"
      - "integrations/telegram-bot-cloudflare/**"
      - "integrations/cloudflare-api/**"
      - "tools/import_histology_media.py"
      - "tools/test_import_histology_media.py"
      - "docs/histology-mbh-import-plan.md"
      - "docs/HISTOLOGY-CONTENT-ARCHIVE-2026-10-12.md"
      - ".github/workflows/optional-integrations-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-integrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Telegram bot public commands and webhook
        working-directory: integrations/telegram-bot
        run: npm test
      - name: Test Cloudflare Workers Telegram webhook
        working-directory: integrations/telegram-bot-cloudflare
        run: npm test
      - name: Test Cloudflare API migration scaffold
        working-directory: integrations/cloudflare-api
        run: npm test
      - name: Test histology media archive importer
        run: python -m unittest tools/test_import_histology_media.py
      - name: Validate extension JavaScript syntax
        run: |
          node --check integrations/browser-extension/popup.js
          node --check integrations/browser-extension/sidepanel.js
          node --check integrations/browser-extension/background.js
      - name: Validate extension manifest and permission boundary
        run: |
          node -e '
            const fs = require("node:fs");
            const assert = require("node:assert/strict");
            const root = "integrations/browser-extension";
            const manifest = JSON.parse(fs.readFileSync(root + "/manifest.json", "utf8"));
            const html = fs.readFileSync(root + "/sidepanel.html", "utf8");
            const script = fs.readFileSync(root + "/sidepanel.js", "utf8");
            assert.equal(manifest.manifest_version, 3);
            assert.equal(manifest.side_panel.default_path, "sidepanel.html");
            assert.deepEqual([...manifest.permissions].sort(), ["activeTab", "scripting", "sidePanel"].sort());
            assert.equal(manifest.host_permissions, undefined, "extension must not request host permissions");
            assert.equal(manifest.background.service_worker, "background.js");
            assert.match(html, /sidepanel\.js/);
            assert.match(script, /https:\/\/medbiohim\.vercel\.app/);
            assert.doesNotMatch(script, /chrome\.cookies|chrome\.history|localStorage|sessionStorage/);
            console.log("Extension manifest and minimal-permission checks configured.");
          '
