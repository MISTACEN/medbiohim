name: Fix build typecheck
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exclude scripts/ from Next.js tsconfig
        run: |
          python3 << 'PY'
          import json
          from pathlib import Path
          p = Path("tsconfig.json")
          data = json.loads(p.read_text())
          excl = data.setdefault("exclude", [])
          for item in ["scripts/**", "scripts", "**/*.b64"]:
              if item not in excl:
                  excl.append(item)
          # keep existing worker excludes
          for item in ["node_modules", "workers/api/**", "integrations/cloudflare-api/**"]:
              if item not in excl:
                  excl.append(item)
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print(p.read_text())
          PY

      - name: Fix groups.ts / subjects.ts param string types
        run: |
          python3 << 'PY'
          from pathlib import Path
          for rel in ["workers/api/src/routes/groups.ts", "workers/api/src/routes/subjects.ts"]:
              p = Path(rel)
              t = p.read_text()
              # const id = c.req.param("id"); -> always string
              t2 = t.replace(
                  'const id = c.req.param("id");',
                  'const id = String(c.req.param("id") ?? "");',
              )
              # also cover single-line forms
              t2 = t2.replace(
                  'const id = c.req.param("id")',
                  'const id = String(c.req.param("id") ?? "")',
              )
              if t2 == t:
                  print(rel, "no param replace needed or already fixed")
              else:
                  p.write_text(t2)
                  print(rel, "fixed")
              # verify no bare UUID.test(id) with possibly undefined left
              assert 'String(c.req.param("id")' in p.read_text() or 'c.req.param("id") ??' in p.read_text()
          PY

      - name: Also rename scripts TS so Next never typechecks them (safety)
        run: |
          # Keep sources, but strip .ts extension for payload copies under scripts/p0
          # Only rename full route mirrors that import hono (not .snippet.ts)
          for f in scripts/p0/groups.ts scripts/p0/subjects.ts scripts/p0/admin-database.ts; do
            if [ -f "$f" ]; then
              mv "$f" "${f%.ts}.source.txt"
              echo "renamed $f"
            fi
          done
          # Leave .snippet.ts and .b64 alone
          ls -la scripts/p0/ || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tsconfig.json workers/api/src/routes/groups.ts workers/api/src/routes/subjects.ts scripts/p0 || true
          git status
          git commit -m "fix: exclude scripts/ from Next tsconfig; String(param) for groups/subjects" || exit 0
          git push origin HEAD:main
