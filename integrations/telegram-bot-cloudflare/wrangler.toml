name = "medbiohim-telegram"
main = "src/worker.js"
compatibility_date = "2026-10-26"
workers_dev = true

# Bot → API Worker calls (ingest relay, account-link confirm, daily digest) go
# through the service binding: public workers.dev fetches are cut at the edge by
# account bot protection (non-browser agents), so they must never rely on the
# public URL even though TELEGRAM_INGEST_URL / TELEGRAM_API_ORIGIN stay configured.
[[services]]
binding = "MEDBIOHIM_API"
service = "medbiohim-api"

[triggers]
# Утренний дайджест: 22:00 UTC = 08:00 Владивосток (UTC+10).
crons = ["0 22 * * *"]

[vars]
# Single canonical site. Preview/branch URLs are never used.
MEDBIOHIM_APP_URL = "https://medbiohim.vercel.app"
# Optional: TELEGRAM_BOT_USERNAME = "your_bot_username"
# Optional: TELEGRAM_HOMEWORK_WEBHOOK_URL = "https://your-php-api.example/api/v1/telegram/webhook"
TELEGRAM_ACCOUNT_LINK_WEBHOOK_URL = "https://medbiohim-api.ryazansevegor.workers.dev/api/v1/telegram/account-link/confirm"
# Group messages are sorted by GigaChat in the API Worker. The bot only forwards
# updates and sends the short confirmation back to the group.
TELEGRAM_INGEST_URL = "https://medbiohim-api.ryazansevegor.workers.dev/api/v1/telegram/ingest"
# FA1: базовый URL API-воркера для утреннего дайджеста (bot → API, internal secret).
TELEGRAM_API_ORIGIN = "https://medbiohim-api.ryazansevegor.workers.dev/api/v1"
# Set TELEGRAM_BOT_TOKEN and TELEGRAM_WEBHOOK_SECRET as Worker secrets, not here.
# The API Worker must have the SAME TELEGRAM_WEBHOOK_SECRET (or a dedicated
# TELEGRAM_INGEST_SECRET), otherwise it answers 503 and no homework is created.

# Optional idempotency. Bind a KV namespace named TELEGRAM_UPDATES to skip
# repeated Telegram update_id values for 24 hours. Without this binding the
# Worker behaves exactly as before (no deduplication) and needs no KV at all.
# [[kv_namespaces]]
# binding = "TELEGRAM_UPDATES"
# id = "<your-kv-namespace-id>"
