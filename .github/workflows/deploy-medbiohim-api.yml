# Sole production API deploy.
# Topology: docs/WORKERS-TOPOLOGY.md
#   medbiohim-api        = PROD (this workflow → workers/api → name medbiohim-api)
#   medbiohim-api-shadow = legacy fallback (manual workflow only)
#   medbiohim-telegram   = bot only
# Shadow/Telegram Builds do NOT update production API.

name: Deploy MEDBIOHIM API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/api/**"
      - ".github/workflows/deploy-medbiohim-api.yml"

permissions:
  contents: read

concurrency:
  group: medbiohim-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Bundle gate: тяжёлый pdf-парсинг в request-path может раздуть бандл;
      # лимит старта paid-плана — 10 MiB gzip, гейтимся сухим прогоном до деплоя.
      - name: Bundle size gate (wrangler dry-run)
        working-directory: workers/api
        run: |
          npx wrangler deploy --dry-run --outdir=.wrangler-bundle > dry-run.log 2>&1 || { cat dry-run.log; exit 1; }
          LINE=$(grep -iE "Total Upload" dry-run.log | tail -1)
          echo "$LINE"
          KIB=$(echo "$LINE" | grep -oE "[0-9]+(.[0-9]+)?" | head -1)
          AWK_RES=$(awk -v k="$KIB" 'BEGIN { print (k > 8192) ? "over" : "ok" }')
          if [ "$AWK_RES" = "over" ]; then echo "Бандл воркера ${KIB} KiB > 8192 KiB — вынеси pdf-парсинг из request-path"; exit 1; fi
      - name: Deploy production Worker (medbiohim-api ONLY)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a7556b4deb0cc2bad2c6d6b1a7381601

      # GigaChat (roadmap: выбор модели в тьюторе). Секреты репозитория
      # регистрируются на воркере при каждом деплое — значения не логируются.
      - name: Configure GigaChat secrets on the Worker
        run: |
          echo "$GIGACHAT_CREDENTIALS" | npx wrangler secret put GIGACHAT_CREDENTIALS
          echo "$GIGACHAT_SCOPE" | npx wrangler secret put GIGACHAT_SCOPE
          echo "$GIGACHAT_MODEL" | npx wrangler secret put GIGACHAT_MODEL
          echo "$GIGACHAT_FALLBACK_BASE_URL" | npx wrangler secret put GIGACHAT_FALLBACK_BASE_URL
          echo "$GIGACHAT_RELAY_SECRET" | npx wrangler secret put GIGACHAT_RELAY_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a7556b4deb0cc2bad2c6d6b1a7381601
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          GIGACHAT_MODEL: ${{ secrets.GIGACHAT_MODEL }}
          GIGACHAT_FALLBACK_BASE_URL: ${{ secrets.GIGACHAT_FALLBACK_BASE_URL }}
          GIGACHAT_RELAY_SECRET: ${{ secrets.GIGACHAT_RELAY_SECRET }}
