<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-label="Схема нервно-мышечного синапса">
  <rect width="640" height="340" fill="#f8fafc"/>
  <!-- мышечное волокно -->
  <rect x="20" y="210" width="600" height="100" rx="16" fill="#fce7f3" stroke="#111827" stroke-width="2"/>
  <!-- вторичные щели -->
  <g fill="#fff" stroke="#111827" stroke-width="1.5">
    <rect x="250" y="214" width="26" height="52" rx="6"/>
    <rect x="300" y="214" width="26" height="52" rx="6"/>
    <rect x="350" y="214" width="26" height="52" rx="6"/>
    <rect x="400" y="214" width="26" height="52" rx="6"/>
  </g>
  <!-- аксональная терминаль -->
  <ellipse cx="330" cy="150" rx="112" ry="62" fill="#e5e7eb" stroke="#111827" stroke-width="2"/>
  <!-- синаптические пузырьки -->
  <g fill="#fff" stroke="#111827" stroke-width="1.5">
    <circle cx="290" cy="132" r="10"/><circle cx="315" cy="120" r="10"/><circle cx="342" cy="128" r="10"/>
    <circle cx="368" cy="120" r="10"/><circle cx="300" cy="156" r="10"/><circle cx="330" cy="162" r="10"/>
    <circle cx="360" cy="156" r="10"/><circle cx="382" cy="142" r="10"/>
  </g>
  <!-- митохондрии -->
  <g fill="#f59e0b" stroke="#111827" stroke-width="1.5">
    <ellipse cx="255" cy="150" rx="18" ry="9" transform="rotate(-20 255 150)"/>
    <ellipse cx="405" cy="164" rx="18" ry="9" transform="rotate(20 405 164)"/>
  </g>
  <!-- синаптическая щель -->
  <line x1="220" y1="208" x2="440" y2="208" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 6"/>
  <!-- номера -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <circle cx="330" cy="96" r="13" fill="#dc2626"/><text x="326" y="101" fill="#fff">1</text>
    <circle cx="222" cy="150" r="13" fill="#dc2626"/><text x="218" y="155" fill="#fff">2</text>
    <circle cx="438" cy="150" r="13" fill="#dc2626"/><text x="434" y="155" fill="#fff">3</text>
    <circle cx="470" cy="196" r="13" fill="#dc2626"/><text x="466" y="201" fill="#fff">4</text>
    <circle cx="505" cy="236" r="13" fill="#dc2626"/><text x="501" y="241" fill="#fff">5</text>
    <circle cx="330" cy="236" r="13" fill="#dc2626"/><text x="326" y="241" fill="#fff">6</text>
    <circle cx="380" cy="290" r="13" fill="#dc2626"/><text x="376" y="295" fill="#fff">7</text>
    <circle cx="80" cy="290" r="13" fill="#dc2626"/><text x="76" y="295" fill="#fff">8</text>
  </g>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="13" fill="#475569">Схема для различения структур, не электронограмма.</text>
</svg>