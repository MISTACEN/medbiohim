name: Fix questions route
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write questions.ts
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          b64 = open('.github/workflows/_questions.b64').read().strip()
          Path('workers/api/src/routes/questions.ts').write_text(base64.b64decode(b64).decode())
          print('wrote', Path('workers/api/src/routes/questions.ts').stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/routes/questions.ts
          git commit -m "feat(api): questions mini-quiz GET + POST check" || exit 0
          git push origin HEAD:main
