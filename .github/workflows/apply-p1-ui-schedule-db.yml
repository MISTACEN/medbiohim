name: Apply P1 UI schedule database
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch home page academic identity
        run: |
          python3 << 'PY'
          from pathlib import Path
          home = Path('src/app/page.tsx')
          t = home.read_text()
          if 'data-testid="academic-identity"' in t:
              print('home already has academic identity')
          else:
              snippet = Path('scripts/p0/home-academic-ui.snippet.tsx').read_text()
              needle = 'Расписание, предметы, задания и подготовка — в одном месте.\n          </p>'
              if needle not in t:
                  raise SystemExit('home needle missing')
              t = t.replace(needle, needle + '\n' + snippet, 1)
              home.write_text(t)
              print('home patched', home.stat().st_size)
          assert 'academic-identity' in home.read_text()
          # GraduationCap already imported in page
          if 'GraduationCap' not in home.read_text().split('from "lucide-react"')[0] + home.read_text().split('from "lucide-react"')[1][:400]:
              print('warn: check GraduationCap import')
          PY

      - name: Inject admin schedule routes + fix role_in_group
        run: |
          python3 << 'PY'
          from pathlib import Path
          admin = Path('workers/api/src/routes/admin.ts')
          t = admin.read_text()
          # schema fix: group_memberships.role_in_group
          t = t.replace('role: "student"', 'role_in_group: "student"')
          t = t.replace('.update({ is_active: true, role: "student"', '.update({ is_active: true, role_in_group: "student"')
          if 'admin.get("/schedule"' not in t:
              snippet = Path('scripts/p0/admin-schedule.snippet.ts').read_text() if Path('scripts/p0/admin-schedule.snippet.ts').exists() else ''
              if not snippet:
                  # minimal inline fallback
                  snippet = '''
admin.get("/schedule", requireAuth, async (c) => {
  const rid = requestId(), db = c.get("supabase");
  if (!await gate(c)) return;
  const groupId = String(c.req.query("group_id") || "").trim();
  const semester = Number(c.req.query("semester") || 0) || null;
  if (!UUID.test(groupId)) return error(c, rid, 422, "VALIDATION_ERROR", "group_id required");
  try {
    let q = db.from("schedules").select("id,group_id,semester,version,is_active").eq("group_id", groupId).eq("is_active", true).limit(20);
    if (semester != null) q = q.eq("semester", semester);
    const { data: schedules, error: sErr } = await q;
    if (sErr) return error(c, rid, 503, "DB_UNAVAILABLE", "schedule load failed");
    const ids = (schedules || []).map((s: any) => s.id).filter(Boolean);
    if (!ids.length) return c.json(ok({ items: [], schedules: [], group_id: groupId, semester }, rid));
    const { data: entries, error: eErr } = await db.from("schedule_entries").select("id,schedule_id,date,start_time,end_time,subject_id,subject_name,type,building,room,notes,academic_hours,week_parity,is_cancelled,teacher,sort_order").in("schedule_id", ids).order("date", { ascending: true }).limit(2000);
    if (eErr) return error(c, rid, 503, "DB_UNAVAILABLE", "entries load failed");
    return c.json(ok({ items: entries || [], schedules: schedules || [], group_id: groupId, semester }, rid));
  } catch { return error(c, rid, 503, "DB_UNAVAILABLE", "schedule load failed"); }
});

admin.put("/schedule", requireAuth, async (c) => {
  const rid = requestId(), db = c.get("supabase");
  if (!await gate(c, STRICT_ADMINS)) return;
  const input = await bodyJson(c);
  if (!input) return error(c, rid, 400, "VALIDATION_ERROR", "bad json");
  const groupId = String(input.group_id || "").trim();
  const semester = Number(input.semester || 0);
  if (!UUID.test(groupId) || semester < 1 || semester > 12) return error(c, rid, 422, "VALIDATION_ERROR", "group_id and semester required");
  const entries = Array.isArray(input.entries) ? input.entries : [];
  try {
    let { data: existing } = await db.from("schedules").select("id,version").eq("group_id", groupId).eq("semester", semester).eq("is_active", true).maybeSingle();
    let scheduleId = existing?.id as string | undefined;
    if (!scheduleId) {
      const { data: created, error: cErr } = await db.from("schedules").insert({ group_id: groupId, semester, is_active: true, version: 1 }).select("id").maybeSingle();
      if (cErr || !created) return error(c, rid, 503, "DB_ERROR", cErr?.message || "create schedule failed");
      scheduleId = created.id;
    } else {
      await db.from("schedules").update({ version: Number(existing?.version || 0) + 1 }).eq("id", scheduleId);
    }
    await db.from("schedule_entries").delete().eq("schedule_id", scheduleId);
    if (!entries.length) return c.json(ok({ saved: 0, schedule_id: scheduleId }, rid));
    const rows = entries.map((e: any, i: number) => ({
      schedule_id: scheduleId,
      date: String(e.date || "").slice(0, 10) || null,
      start_time: String(e.start_time || e.startTime || "").slice(0, 8) || null,
      end_time: String(e.end_time || e.endTime || "").slice(0, 8) || null,
      subject_id: e.subject_id && UUID.test(String(e.subject_id)) ? e.subject_id : null,
      subject_name: e.subject_name || e.subject || e.title || null,
      type: e.type || "lecture",
      building: e.building || null,
      room: e.room || null,
      notes: e.notes || null,
      academic_hours: e.academic_hours != null ? Number(e.academic_hours) : null,
      week_parity: e.week_parity || null,
      is_cancelled: Boolean(e.is_cancelled),
      teacher: e.teacher || null,
      sort_order: e.sort_order != null ? Number(e.sort_order) : i,
    })).filter((r: any) => r.date && r.start_time);
    let saved = 0;
    for (let i = 0; i < rows.length; i += 200) {
      const chunk = rows.slice(i, i + 200);
      const { error: insErr } = await db.from("schedule_entries").insert(chunk);
      if (insErr) return error(c, rid, 503, "DB_ERROR", insErr.message || "insert failed");
      saved += chunk.length;
    }
    return c.json(ok({ saved, schedule_id: scheduleId, group_id: groupId, semester }, rid));
  } catch { return error(c, rid, 503, "DB_ERROR", "save schedule failed"); }
});

admin.post("/schedule/import", requireAuth, async (c) => {
  const rid = requestId();
  if (!await gate(c, STRICT_ADMINS)) return;
  const ct = (c.req.header("content-type") || "").toLowerCase();
  let groupId = "", semester: number | null = null, entries: any[] = [];
  try {
    if (ct.includes("application/json")) {
      const input = await bodyJson(c);
      groupId = String(input?.group_id || "").trim();
      semester = input?.semester != null ? Number(input.semester) : null;
      entries = Array.isArray(input?.entries) ? input.entries : [];
    } else {
      const form = await c.req.parseBody();
      groupId = String(form.group_id || "").trim();
      semester = form.semester != null ? Number(form.semester) : null;
      if (typeof form.entries === "string") { try { entries = JSON.parse(String(form.entries)); } catch { entries = []; } }
      if (!entries.length && form.file) return error(c, rid, 422, "VALIDATION_ERROR", "XLSX not supported yet; pass entries JSON or use PUT /admin/schedule");
    }
  } catch { return error(c, rid, 400, "VALIDATION_ERROR", "bad body"); }
  if (!UUID.test(groupId) || !semester) return error(c, rid, 422, "VALIDATION_ERROR", "group_id and semester required");
  const putReq = new Request(new URL("/api/v1/admin/schedule", c.req.url).toString(), {
    method: "PUT",
    headers: { "content-type": "application/json", authorization: c.req.header("authorization") || "" },
    body: JSON.stringify({ group_id: groupId, semester, entries }),
  });
  return admin.fetch(putReq, c.env, c.executionCtx);
});
'''
              marker = 'admin.route("/database"'
              if marker not in t:
                  raise SystemExit('database route marker missing')
              t = t.replace(marker, snippet + '\n' + marker, 1)
              print('schedule injected')
          else:
              print('schedule already present')
          admin.write_text(t)
          assert 'admin.get("/schedule"' in admin.read_text()
          print('admin', admin.stat().st_size)
          PY

      - name: Upgrade admin-database writes if source present
        continue-on-error: true
        run: |
          if [ -f scripts/p0/admin-database.ts ]; then
            cp scripts/p0/admin-database.ts workers/api/src/routes/admin-database.ts
            grep -q 'rows/:table' workers/api/src/routes/admin-database.ts
            wc -c workers/api/src/routes/admin-database.ts
          else
            echo 'scripts/p0/admin-database.ts missing — skip'
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx workers/api/src/routes/admin.ts workers/api/src/routes/admin-database.ts || true
          git status
          git commit -m "feat: home academic identity UI + admin schedule write/import + db writes" || exit 0
          git push origin HEAD:main
