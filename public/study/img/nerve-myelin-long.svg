<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Схема продольного среза миелинового нервного волокна">
  <rect width="640" height="300" fill="#f8fafc"/>
  <!-- осевой цилиндр -->
  <rect x="20" y="138" width="600" height="24" rx="12" fill="#e5e7eb" stroke="#111827" stroke-width="1.5"/>
  <!-- миелиновые сегменты: два сегмента с перехватом -->
  <rect x="40" y="108" width="230" height="84" rx="8" fill="#111827"/>
  <rect x="300" y="108" width="230" height="84" rx="8" fill="#111827"/>
  <!-- перехват Ранвье: сужение и контакт леммоцитов -->
  <rect x="270" y="132" width="30" height="36" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
  <!-- насечки миелина -->
  <g stroke="#f8fafc" stroke-width="3">
    <line x1="90" y1="112" x2="70" y2="188"/>
    <line x1="150" y1="112" x2="130" y2="188"/>
    <line x1="210" y1="112" x2="190" y2="188"/>
    <line x1="350" y1="112" x2="330" y2="188"/>
    <line x1="410" y1="112" x2="390" y2="188"/>
    <line x1="470" y1="112" x2="450" y2="188"/>
  </g>
  <!-- мезаксон: сдвоенная мембрана на границе миелина и аксона -->
  <line x1="40" y1="138" x2="270" y2="138" stroke="#f59e0b" stroke-width="2"/>
  <line x1="300" y1="162" x2="530" y2="162" stroke="#f59e0b" stroke-width="2"/>
  <!-- номера -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <circle cx="200" cy="150" r="13" fill="#dc2626"/><text x="196" y="155" fill="#fff">1</text>
    <circle cx="110" cy="88" r="13" fill="#dc2626"/><text x="106" y="93" fill="#fff">2</text>
    <circle cx="285" cy="92" r="13" fill="#dc2626"/><text x="281" y="97" fill="#fff">3</text>
    <circle cx="560" cy="108" r="13" fill="#dc2626"/><text x="556" y="113" fill="#fff">4</text>
    <circle cx="165" cy="208" r="13" fill="#dc2626"/><text x="161" y="213" fill="#fff">5</text>
    <circle cx="360" cy="150" r="13" fill="#dc2626"/><text x="356" y="155" fill="#fff">6</text>
    <circle cx="430" cy="228" r="13" fill="#dc2626"/><text x="426" y="233" fill="#fff">7</text>
  </g>
  <text x="20" y="275" font-family="Arial, sans-serif" font-size="13" fill="#475569">Схема для различения срезов, не электронограмма. Слева — нейролемма и миелин, справа — второй межузловой сегмент.</text>
</svg>