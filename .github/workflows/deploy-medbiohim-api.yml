# Sole production API deploy.
# Topology: docs/WORKERS-TOPOLOGY.md
#   medbiohim-api        = PROD (this workflow → workers/api → name medbiohim-api)
#   medbiohim-api-shadow = legacy fallback (manual workflow only)
#   medbiohim-telegram   = bot only
# Shadow/Telegram Builds do NOT update production API.

name: Deploy MEDBIOHIM API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/api/**"
      - ".github/workflows/deploy-medbiohim-api.yml"

permissions:
  contents: read

concurrency:
  group: medbiohim-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/api/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Deploy production Worker (medbiohim-api ONLY)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a7556b4deb0cc2bad2c6d6b1a7381601
