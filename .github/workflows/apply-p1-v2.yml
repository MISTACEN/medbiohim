name: Apply P1 v2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Home academic identity UI
        run: |
          python3 << 'PY'
          from pathlib import Path
          home = Path("src/app/page.tsx")
          t = home.read_text()
          if 'data-testid="academic-identity"' in t:
              print("already")
          else:
              sn = Path("scripts/p0/home-academic-ui.snippet.tsx").read_text()
              needle = "Расписание, предметы, задания и подготовка — в одном месте.\n          </p>"
              if needle not in t:
                  raise SystemExit("needle missing")
              home.write_text(t.replace(needle, needle + "\n" + sn, 1))
              print("patched")
          assert "academic-identity" in home.read_text()
          PY

      - name: Admin schedule + role_in_group fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("workers/api/src/routes/admin.ts")
          t = p.read_text()
          t = t.replace('role: "student"', 'role_in_group: "student"')
          if 'admin.get("/schedule"' not in t:
              sn = Path("scripts/p0/admin-schedule.snippet.ts")
              if sn.exists():
                  body = sn.read_text()
              else:
                  raise SystemExit("missing schedule snippet")
              marker = 'admin.route("/database"'
              if marker not in t:
                  raise SystemExit("no database marker")
              t = t.replace(marker, body + "\n" + marker, 1)
              print("schedule injected")
          else:
              print("schedule present")
          p.write_text(t)
          assert 'admin.get("/schedule"' in p.read_text()
          print("admin", p.stat().st_size)
          PY

      - name: Admin database writes
        continue-on-error: true
        run: |
          if [ -f scripts/p0/admin-database.ts ]; then
            cp scripts/p0/admin-database.ts workers/api/src/routes/admin-database.ts
            grep -q 'post("/:id/rows' workers/api/src/routes/admin-database.ts
            wc -c workers/api/src/routes/admin-database.ts
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx workers/api/src/routes/admin.ts workers/api/src/routes/admin-database.ts || true
          git status
          git commit -m "feat: home group/course/semester UI + admin schedule write + db writes" || exit 0
          git push origin HEAD:main
