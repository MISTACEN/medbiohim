name: MEDBIOHIM smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "ROADMAP.md"
      - "PHASES_STATUS.md"
      - "SYNC_STAMP.md"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      APP_URL: https://medbiohim.vercel.app
    steps:
      - name: Check public pages
        run: |
          set -euo pipefail
          for path in / /tests /schedule /subjects /materials /trainers /atlas /assignments /progress /community /calculators /changelog /help; do
            code=$(curl -L --fail --silent --show-error --max-time 20 -o /tmp/page.html -w "%{http_code}" "$APP_URL$path")
            test "$code" = "200"
            grep -q "Медбиохим" /tmp/page.html
          done

      - name: Check authenticated gates render (guest view)
        run: |
          set -euo pipefail
          # гостю показывается честный гейт входа, а не ошибка/пустая страница
          for path in /homework /bookmarks /tutor; do
            html=$(curl -L --silent --max-time 20 "$APP_URL$path")
            echo "$html" | grep -q "Медбиохим"
            if echo "$html" | grep -q "Не удалось показать страницу"; then
              echo "error boundary on $path"; exit 1
            fi
          done

      - name: Check API health
        run: |
          set -euo pipefail
          code=$(curl -L --fail --silent --show-error --max-time 20 -o /tmp/health.json -w "%{http_code}" "$APP_URL/api/v1/health")
          test "$code" = "200"
          grep -q '"status"' /tmp/health.json
          grep -q '"ok"' /tmp/health.json
          cat /tmp/health.json

      - name: Check public API surfaces
        run: |
          set -euo pipefail
          for path in /api/v1/tests /api/v1/subjects; do
            code=$(curl -L --silent --show-error --max-time 20 -o /tmp/api.json -w "%{http_code}" "$APP_URL$path")
            case "$code" in
              200|401|403) ;;
              *) echo "Unexpected HTTP $code from $path"; cat /tmp/api.json; exit 1 ;;
            esac
          done

  # G3: браузерный smoke (Playwright) против локальной сборки — то, что curl
  # не покрывает: клиентский гидрейт, error boundary, тема, Ctrl+K.
  playwright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # webServer в playwright.config.ts сам поднимает next start,
      # поэтому SMOKE_BASE_URL здесь не задаётся.
      - name: Run Playwright smoke
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
