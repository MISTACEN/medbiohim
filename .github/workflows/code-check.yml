name: MEDBIOHIM code checks

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm install
      - name: Detect literal escaped-newline source artifacts
        run: |
          set -euo pipefail
          if grep -RInE '\\\\n[[:space:]]*(async|const|let|var|return|export|import|function|if|for|while|class|type|interface|<)' src backend --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.php'; then
            echo 'Found a literal \\n embedded in source code.'
            exit 1
          fi
      - name: TypeScript and Next build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax check
        run: |
          set -euo pipefail
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
