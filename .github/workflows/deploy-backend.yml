name: Deploy backend to SpaceWeb

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/config/routes/**"
      - "backend/config/**"
      - "content/histology/**"

concurrency:
  group: deploy-spaceweb
  cancel-in-progress: false

env:
  FTP_HOST: 77.222.40.198
  FTP_USER: ryazansev3_logigpt
  FTP_PASS: ${{ secrets.FTP_PASSWORD }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Guard secret
        run: |
          if [ -z "$FTP_PASS" ]; then
            echo "::error::Repository secret FTP_PASSWORD is not set."
            exit 1
          fi

      - name: Pre-deploy PHP and route checks
        run: |
          set -euo pipefail
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php backend/tests/TrainingPayloadSanitizerTest.php
          php backend/tests/SupabaseAuthRoleTest.php
          php backend/tests/HomeworkSqlContractTest.php
          php backend/tests/AccountSettingsPreferencesTest.php
          php -d display_errors=1 -r '
            $root = getcwd() . "/backend";
            spl_autoload_register(static function (string $class) use ($root): void {
              $prefix = "Medbiohim\\";
              if (!str_starts_with($class, $prefix)) return;
              $relative = str_replace("\\", "/", substr($class, strlen($prefix)));
              $file = $root . "/src/" . $relative . ".php";
              if (is_readable($file)) require_once $file;
            });
            $router = new \Medbiohim\Http\Router();
            $register = require $root . "/config/routes.php";
            if (!is_callable($register)) throw new \RuntimeException("config/routes.php must return callable");
            $register($router);
            echo "Route registration OK\n";
          '

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Discover site root on FTP
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          BASE="ftp://$FTP_HOST"
          AUTH=(--ssl -k --max-time 30 -u "$FTP_USER:$FTP_PASS")
          list_dirs() {
            curl -sS "${AUTH[@]}" "$BASE/$1" 2>/dev/null |
              awk '$1 ~ /^d/ { $1=$2=$3=$4=$5=$6=$7=$8=""; sub(/^ +/,""); print }' |
              grep -vE '^\.\.?$' || true
          }
          has_backend() {
            curl -sS "${AUTH[@]}" "$BASE/$1backend/public/" 2>/dev/null | grep -q "index.php"
          }
          declare -a level=("")
          found=""
          for depth in 0 1 2 3; do
            declare -a next=()
            for p in "${level[@]}"; do
              if [ -z "$p" ] && [ "$depth" != "0" ]; then continue; fi
              if has_backend "$p"; then found="$p"; break; fi
              while IFS= read -r d; do
                case "$d" in logs|cgi-bin|.ftpquota|.*) continue;; esac
                next+=("$p$d/")
              done < <(list_dirs "$p")
            done
            [ -n "$found" ] && break
            [ "${#next[@]}" -eq 0 ] && break
            level=("${next[@]}")
          done
          if [ -z "$found" ]; then
            echo "::error::backend/public/index.php not found on FTP."
            exit 1
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Backup current backend
        run: |
          SITE="${{ steps.discover.outputs.found }}"
          mkdir -p backup
          set -euo pipefail
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2;
            mirror --verbose '${SITE}backend/src' backup/src;
            mirror --verbose '${SITE}backend/config/routes' backup/routes;
            get -O backup/ '${SITE}backend/config/routes.php';
            bye"
          test -s backup/routes.php
          test -s backup/routes/platform.php
          test -s backup/src/Repositories/TestRepository.php
          echo "Verified a non-empty backend backup before deploying."

      - name: Deploy backend source and routes
        run: |
          set -euo pipefail
          SITE="${{ steps.discover.outputs.found }}"
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3;
            mirror -R --verbose ./backend/src '${SITE}backend/src';
            mirror -R --verbose ./backend/config/routes '${SITE}backend/config/routes';
            put -O '${SITE}backend/config/' backend/config/routes.php;
            bye"

      - name: Deploy histology media when present in repository
        run: |
          set -euo pipefail
          SITE="${{ steps.discover.outputs.found }}"
          if [ -d content/histology ]; then
            lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" -e "
              set cmd:fail-exit yes;
              set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 3;
              mirror -R --verbose ./content/histology '${SITE}content/histology';
              bye"
          else
            echo "No content/histology in GitHub checkout; leaving existing server media untouched."
          fi

      - name: Verify deployed backend markers
        run: |
          set -euo pipefail
          SITE="${{ steps.discover.outputs.found }}"
          mkdir -p verify
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-allow yes; set ssl:verify-certificate no;
            get -O verify/ '${SITE}backend/src/Repositories/TestRepository.php';
            get -O verify/ '${SITE}backend/config/routes.php';
            get -O verify/ '${SITE}backend/config/routes/preparation.php';
            get -O verify/ '${SITE}backend/config/routes/tests.php';
            get -O verify/ '${SITE}backend/config/routes/platform.php';
            get -O verify/ '${SITE}backend/config/routes/material_viewer.php';
            get -O verify/ '${SITE}backend/config/routes/content_integration.php';
            get -O verify/ '${SITE}backend/config/routes/files.php';
            get -O verify/ '${SITE}backend/src/Repositories/FileRepository.php';
            get -O verify/ '${SITE}backend/src/Services/SpecialtyAccess.php';
            get -O verify/ '${SITE}backend/src/Services/AcademicContextResolver.php';
            get -O verify/ '${SITE}backend/src/Repositories/SubjectRepository.php';
            get -O verify/ '${SITE}backend/src/Services/SupabaseRest.php';
            get -O verify/ '${SITE}backend/config/routes/domain.php';
            get -O verify/ '${SITE}backend/src/Security/TrainingPayloadSanitizer.php';
            bye"
          grep -q "use Medbiohim\\\\Http\\\\Router;" verify/routes.php
          grep -q "LEFT JOIN public.content_sources cs ON cs.id = t.source_key" verify/TestRepository.php
          grep -q "function resolveTestId" verify/preparation.php
          grep -q "function resolveTestId" verify/tests.php
          grep -q "trainers/feed/{id}/image" verify/platform.php
          grep -q '\$hasMbhAccess' verify/platform.php
          grep -q "subject_slug.*histology" verify/platform.php
          grep -q "correctOptionId" verify/TrainingPayloadSanitizer.php
          grep -q "function sanitizeQuestion" verify/TrainingPayloadSanitizer.php
          grep -q "subjectSlug === 'histology'" verify/material_viewer.php
          test "$(grep -c 'requiredSpecialty' verify/material_viewer.php)" -ge 4
          grep -q "subjectSlug === 'histology'" verify/content_integration.php
          grep -q "is_histology_source" verify/content_integration.php
          test "$(grep -F -c 'use ($filterMaterialsForUser)' verify/content_integration.php)" -ge 2
          grep -q "is_histology_material" verify/FileRepository.php
          grep -q "requiredSpecialtyForFile" verify/files.php
          grep -q "subjectSlug === 'histology'" verify/SpecialtyAccess.php
          grep -q "COALESCE(subjects.slug, '') <> 'histology'" verify/AcademicContextResolver.php
          grep -q "canAccessSubject" verify/domain.php
          grep -q "WHERE is_active = true" verify/SubjectRepository.php
          grep -q "specialty_slug,course_number" verify/SupabaseRest.php
          echo "Backend deployment verification passed."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-backup-${{ github.run_id }}
          path: backup/
          retention-days: 14
          if-no-files-found: ignore

# 2026-10-04: deployment verifier aligned with current backend contracts.
