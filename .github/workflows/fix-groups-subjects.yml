name: Fix groups subjects routes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force copy from scripts/p0
        run: |
          set -e
          cp scripts/p0/groups.ts workers/api/src/routes/groups.ts
          cp scripts/p0/subjects.ts workers/api/src/routes/subjects.ts
          grep -q 'groups.post' workers/api/src/routes/groups.ts
          grep -q 'subjects.post' workers/api/src/routes/subjects.ts
          wc -c workers/api/src/routes/groups.ts workers/api/src/routes/subjects.ts
          head -3 workers/api/src/routes/groups.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/routes/groups.ts workers/api/src/routes/subjects.ts
          git commit -m "feat(api): restore groups/subjects CRUD from scripts/p0" || exit 0
          git push origin HEAD:main
