name: Apply P0 v2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject academic endpoint into admin.ts
        run: |
          python3 << 'PY'
          from pathlib import Path
          admin = Path('workers/api/src/routes/admin.ts')
          t = admin.read_text()
          if 'admin.put("/users/:id/academic"' in t:
              print('already present')
          else:
              snippet = Path('scripts/p0/academic.ts.snippet').read_text()
              for marker in ['// Telegram chat management', 'admin.route("/database"', 'export default admin']:
                  if marker in t:
                      t = t.replace(marker, snippet + '\n' + marker, 1)
                      break
              admin.write_text(t)
              print('injected')
          assert 'admin.put("/users/:id/academic"' in admin.read_text()
          PY

      - name: Write groups/subjects if payloads exist
        continue-on-error: true
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          root = Path('scripts/p0')
          def join(prefix):
              parts = sorted(root.glob(prefix + '*.b64'))
              if not parts:
                  return None
              return ''.join(p.read_text().strip() for p in parts)
          for prefix, dest in [('g', 'workers/api/src/routes/groups.ts'), ('s', 'workers/api/src/routes/subjects.ts')]:
              if (root / (prefix + 'roups.ts' if prefix=='g' else 'subjects.ts')).exists():
                  pass
              raw = join(prefix)
              if not raw:
                  print('skip', prefix)
                  continue
              try:
                  Path(dest).write_bytes(base64.b64decode(raw))
                  t = Path(dest).read_text()
                  assert 'export default' in t
                  print('ok', dest, len(t))
              except Exception as e:
                  print('fail', dest, e)
          if (root / 'groups.ts').exists():
              Path('workers/api/src/routes/groups.ts').write_text((root / 'groups.ts').read_text())
              print('copied groups.ts')
          if (root / 'subjects.ts').exists():
              Path('workers/api/src/routes/subjects.ts').write_text((root / 'subjects.ts').read_text())
              print('copied subjects.ts')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/routes/admin.ts workers/api/src/routes/groups.ts workers/api/src/routes/subjects.ts || true
          git status
          git commit -m "feat(api): P0 PUT /admin/users/:id/academic (+ groups/subjects if present)" || exit 0
          git push origin HEAD:main
