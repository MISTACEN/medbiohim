# =============================================================================
# SHADOW ONLY — NOT PRODUCTION
# Topology (LOCKED): docs/WORKERS-TOPOLOGY.md
#
#   medbiohim-api          = единственный прод API  (workers/api/)
#   medbiohim-api-shadow   = этот Worker — только fallback MEDBIOHIM_UPSTREAM
#   medbiohim-telegram     = бот
#
# Не слать сюда Vercel CLOUDFLARE_API_ORIGIN.
# Успешный Cloudflare Build этого Worker ≠ прод обновлён.
# Правки student/admin API — в workers/api/, не здесь.
# =============================================================================

name = "medbiohim-api-shadow"
main = "src/index.js"
compatibility_date = "2026-10-11"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true
destinations = ["cloudflare"]

[vars]
APP_ENV = "shadow"
MEDBIOHIM_APP_ORIGIN = "https://medbiohim.vercel.app"
AI_CHAT_PRIMARY_PROVIDER = "groq"
OPENAI_MODEL = "gpt-4.1-mini"
GROQ_MODEL = "llama-3.3-70b-versatile"
MISTRAL_MODEL = "mistral-small-latest"
OPENROUTER_MODEL = "google/gemini-2.5-flash"
GEMINI_MODEL = "gemini-2.0-flash"
GIGACHAT_MODEL = "GigaChat"
UPSTASH_REDIS_REST_URL = "https://rare-oyster-230342.upstash.io"
B2_BUCKET = "medbiohim-files"
AUTH_RATE_LIMIT_ENFORCEMENT_VERIFIED = "true"

[[ratelimits]]
name = "AUTH_LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AUTH_REGISTER_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# Secrets via Dashboard only — never commit values.
