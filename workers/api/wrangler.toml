# =============================================================================
# PRODUCTION API WORKER — medbiohim-api ONLY
# Topology (LOCKED): docs/WORKERS-TOPOLOGY.md
#
#   medbiohim-api          = единственный прод API  (этот файл)
#   medbiohim-api-shadow   = fallback MEDBIOHIM_UPSTREAM only — не развивать как прод
#   medbiohim-telegram     = бот, не HTTP API сайта
#
# Vercel / фронт → https://medbiohim-api.*.workers.dev/api/v1
# НЕ деплоить этот код под именем shadow. НЕ ждать прод от shadow Builds.
# =============================================================================
# Secrets (Dashboard → Workers → medbiohim-api → Settings → Variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SERVICE_KEY
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, UPSTASH_BLOB_TOKEN
#   OPENAI_API_KEY (optional)
#   TELEGRAM_WEBHOOK_SECRET, TELEGRAM_BOT_USERNAME (optional)
#   APP_ORIGIN (e.g. https://medbiohim.vercel.app)
# Never put secrets in this file.

name = "medbiohim-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[vars]
APP_ENV = "production"
CORS_ORIGINS = "https://medbiohim.vercel.app,http://localhost:3000"

# Fallback only for routes still 501 on this Worker. Not a second production API.
[[services]]
binding = "MEDBIOHIM_UPSTREAM"
service = "medbiohim-api-shadow"

[env.production]
name = "medbiohim-api"
workers_dev = false
vars = { APP_ENV = "production", CORS_ORIGINS = "https://medbiohim.vercel.app,http://localhost:3000" }

[[env.production.services]]
binding = "MEDBIOHIM_UPSTREAM"
service = "medbiohim-api-shadow"
